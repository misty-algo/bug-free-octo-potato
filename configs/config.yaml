  username: ""
  password: "root123456"
  db: 0
  pool_size: 10
  dial_timeout: 5s
  read_timeout: 3s
  write_timeout: 3s
  lock:
    key_prefix: huaxiaozhu
    default_ttl: 30s

elasticsearch:
  addresses:
    - http://127.0.0.1:9200
  username: ""
  password: ""
  cloud_id: ""
  api_key: ""

kafka:
  brokers:
    - 127.0.0.1:9092
  topic: huaxiaozhu-events
  group_id: huaxiaozhu-consumer
  client_id: huaxiaozhu
  required_acks: all
  dial_timeout: 5s
  producer:
    max_attempts: 10
    batch_size: 100
    batch_bytes: 1048576
    batch_timeout: 10ms
    read_timeout: 10s
    write_timeout: 10s
    async: false
    compression: none
    allow_auto_topic_creation: false
  consumer:
    queue_capacity: 100
    min_bytes: 1
    max_bytes: 10485760
    max_wait: 10s
    read_batch_timeout: 10s
    commit_interval: 0s
    heartbeat_interval: 3s
    session_timeout: 30s
    rebalance_timeout: 30s
    start_offset: first
    watch_partition_changes: true
    max_attempts: 3
  sasl:
    enable: false
    mechanism: plain
    username: ""
    password: ""
  tls:
    enable: false
    insecure_skip_verify: false
    server_name: ""

rocketmq:
