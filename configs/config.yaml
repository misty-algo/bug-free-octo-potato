app:
  name: xiaolanshu
  env: local

http:
  host: 0.0.0.0
  port: 8080
  read_timeout_seconds: 5
  write_timeout_seconds: 10

grpc:
  host: 0.0.0.0

services:
  driver:
    name: driver-service
    port: 9101
    target: 127.0.0.1:9101
  gateway:
    name: gateway
  user:
    name: user-service
    port: 9001
    target: 127.0.0.1:9001
  note:
    name: note-service
    port: 9002
    target: 127.0.0.1:9002
  order:
    name: order-service
    port: 9100
    target: 127.0.0.1:9100

database:
  # 关系型数据库统一使用本地 PostgreSQL；DSN 见下方 postgresql 块。
  # 可选值：mysql / postgresql / sqlite。
  driver: postgresql
  dsn: ""

postgresql:
  # 本地 Docker 容器 pgsql（postgres:16-alpine，root/root123456）。
  dsn: "host=127.0.0.1 user=root password=root123456 dbname=root port=5432 sslmode=disable TimeZone=Asia/Shanghai"
  max_idle_conns: 10
  max_open_conns: 100
  conn_max_lifetime_seconds: 3600

mongodb:
  # 本地 Docker 容器 mongo（mongo:8.3，root 账号 dev/dev123456）。
  uri: mongodb://127.0.0.1:27017
  username: "dev"
  password: "dev123456"
  database: day1
  app_name: bw-cli
  min_pool_size: 0
  max_pool_size: 100
  connect_timeout_seconds: 10
  server_selection_timeout_seconds: 5

rabbitmq:
  # 本地 Docker 容器 rabbitmq（rabbitmq:3-management，用户 bw/bw123456）。
  url: amqp://bw:bw123456@127.0.0.1:5672/
  exchange: xiaolanshu.events
  exchange_type: topic
  queue: xiaolanshu.order.created
  routing_keys:
    - order.created
  consumer_tag: xiaolanshu-consumer
  prefetch_count: 10
  durable: true
  publish_timeout: 5s
  consume_timeout: 30s
  reconnect_delay: 3s

driver:
  # 司机端业务参数（金额单位统一为「分」，1 元 = 100 分）
  commission_rate: 0.2              # 平台抽成比例
  min_withdraw_fen: 1000            # 最低提现门槛（10 元）
  max_withdraw_fen: 200000          # 单笔提现上限（2000 元）
  daily_withdraw_limit_fen: 500000  # 单日提现累计上限（5000 元）
  daily_withdraw_count: 3           # 单日提现受理次数
  dual_approval_fen: 50000          # 单笔达到 500 元需双人审批
  daily_release_limit: 3            # 单日退单次数上限（仅司机责任计入）
  accept_timeout_seconds: 15        # 邀请确认超时（秒），超时换下一候选
  listen_window_seconds: 60         # 听单通道窗口，结束后转抢单池
  dispatch_window_seconds: 120      # 总派单时限，超时平台责任取消
  heartbeat_timeout_seconds: 60     # 空闲连续无心跳自动收车
  hall_list_limit: 50               # 接单大厅单页上限
  auto_settle_on_trip_end: true     # 课程模拟：无财务域时行程结束即结算
  dispatch_weights:                 # 派单评分权重，总和必须等于 10000
    distance: 4000
    rating: 2500
    online: 1500
    success: 2000

file_storage:
  provider: minio
  max_size_mb: 100
  object_prefix: uploads
  public_base_url: ""
  allowed_extensions:
    - .doc
    - .docx
    - .pdf
    - .jpg
    - .jpeg
    - .png
    - .gif
    - .webp
    - .bmp
    - .svg
    - .mp4
    - .mov
    - .avi
    - .mkv
    - .webm
    - .mp3
    - .wav
    - .ogg
    - .m4a
    - .flac
    - .aac
  allowed_content_types:
    - application/msword
    - application/vnd.openxmlformats-officedocument.wordprocessingml.document
    - application/pdf
    - image/jpeg
    - image/png
    - image/gif
    - image/webp
    - image/bmp
    - image/svg+xml
    - video/mp4
    - video/quicktime
    - video/x-msvideo
    - video/x-matroska
    - video/webm
    - audio/mpeg
    - audio/wav
    - audio/x-wav
    - audio/ogg
    - audio/mp4
    - audio/flac
    - audio/aac
  minio:
    endpoint: ""
    access_key_id: ""
    secret_access_key: ""
    bucket: ""
    region: ""
    use_ssl: false
  oss:
    endpoint: ""
    access_key_id: ""
    access_key_secret: ""
    bucket: ""
  qiniu:
    access_key: ""
    secret_key: ""
    bucket: ""
    region: ""
    use_https: true
    use_cdn_domains: false
  cos:
    secret_id: ""
    secret_key: ""
    bucket: ""
    region: ""
    bucket_url: ""

redis:
  addr: 127.0.0.1:6379
  username: ""
  password: ""
  db: 0
  pool_size: 10
  dial_timeout: 5s
  read_timeout: 3s
  write_timeout: 3s
  lock:
    key_prefix: xiaolanshu
    default_ttl: 30s

elasticsearch:
  addresses:
    - http://127.0.0.1:9200
  username: ""
  password: ""
  cloud_id: ""
  api_key: ""

alipay:
  app_id: ""
  private_key: ""
  alipay_public_key: ""
  production: false
  notify_url: ""
  return_url: ""
  encrypt_key: ""
  app_cert_public_key_path: ""
  alipay_root_cert_path: ""
  alipay_cert_public_key_path: ""

middleware:
  cors:
    allow_origins:
      - "*"
    allow_methods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
      - OPTIONS
    allow_headers:
      - Origin
      - Content-Type
      - Authorization
      - X-Request-ID
    allow_credentials: false
  jwt:
    secret: ""
    issuer: xiaolanshu
    expire_seconds: 7200

log:
  service: xiaolanshu
  environment: local
  level: info
  encoding: json
  file:
    enabled: true
    filename: logs/app.log
    max_size_mb: 128
    max_backups: 14
    max_age_days: 7
    compress: true
