app:
  name: xiaolanshu
  env: local

http:
  host: 0.0.0.0
  port: 8080
  read_timeout_seconds: 5
  write_timeout_seconds: 10

grpc:
  host: 0.0.0.0

services:
  driver:
    name: driver-service
    port: 9101
    target: 127.0.0.1:9101
  gateway:
    name: gateway
  user:
    name: user-service
    port: 9001
    target: 127.0.0.1:9001
  note:
    name: note-service
    port: 9002
    target: 127.0.0.1:9002
  order:
    name: order-service
    port: 9100
    target: 127.0.0.1:9100
  passenger:
    name: passenger-service
    port: 9005
    target: 127.0.0.1:9005
  # 行程域三个服务此前缺配置，gateway 启动时 ServiceTarget 返回空串，
  # grpc.Dial("") 直接失败，导致网关起不来。
  # shop 默认端口 9101 与 driver 撞车，此处改 9104 避开。
  shop:
    name: shop-service
    port: 9104
    target: 127.0.0.1:9104
  payment:
    name: payment-service
    port: 9102
    target: 127.0.0.1:9102
  settlement:
    name: settlement-service
    port: 9103
    target: 127.0.0.1:9103

database:
  driver: mysql
  # 本地联调临时值：本机 phpStudy MySQL 8.0.12。3306 被 Docker 桌面端端口代理
  # 长期占用，故 mysqld 以 --port=3307 启动。
  dsn: "root:root@tcp(127.0.0.1:3307)/xiaolanshu?charset=utf8mb4&parseTime=True&loc=Local"

mysql:
  dsn: "root:root@tcp(127.0.0.1:3307)/xiaolanshu?charset=utf8mb4&parseTime=True&loc=Local"
  max_idle_conns: 10
  max_open_conns: 100
  conn_max_lifetime_seconds: 3600

postgresql:
  dsn: ""
  max_idle_conns: 10
  max_open_conns: 100
  conn_max_lifetime_seconds: 3600

mongodb:
  # 本地联调临时值：指向 docker 起的 mongo:7。27017 被 Docker 桌面端的端口代理
  # 长期占用无法绑定，故容器映射到 27018。
  #
  # 注意（既有缺口）：pkg/config 未实现环境变量覆盖——全包无 os.Getenv、
  # 也无 viper AutomaticEnv/BindEnv，因此 docker-compose 里声明的
  # MONGODB_URI / MONGODB_USERNAME / MONGODB_PASSWORD / MONGODB_DATABASE
  # 实际不会生效，只能落在本文件。后续应补齐该能力再把真值移回环境变量。
  uri: mongodb://127.0.0.1:27018/?authSource=admin
  username: "bw"
  password: "bw-secret"
  database: huazhu
  app_name: bw-cli
  min_pool_size: 0
  max_pool_size: 100
  connect_timeout_seconds: 10
  server_selection_timeout_seconds: 5

security:
  # 实名三件套（Enc/Hash/Mask）AES-256-GCM 密钥，32 字节。
  # 真值 MUST NOT 提交：经环境变量 SECURITY_DATA_KEY 注入；未注入时 user 服务启动直接失败，不用兜底值。
  data_key: ""

rabbitmq:
  # 本地 Docker 容器 rabbitmq（rabbitmq:3-management）。
  # 注意：以下为本地容器默认账号，各人环境不同请自行修改，MUST NOT 提交真实凭据。
  url: amqp://bw:bw123456@127.0.0.1:5672/
  exchange: xiaolanshu.events
  exchange_type: topic
  queue: xiaolanshu.order.created
  routing_keys:
    - order.created
  consumer_tag: xiaolanshu-consumer
  prefetch_count: 10
  durable: true
  publish_timeout: 5s
  consume_timeout: 30s
  reconnect_delay: 3s

driver:
  # 司机端业务参数（金额单位统一为「分」，1 元 = 100 分）
  commission_rate: 0.2              # 平台抽成比例
  min_withdraw_fen: 1000            # 最低提现门槛（10 元）
  max_withdraw_fen: 200000          # 单笔提现上限（2000 元）
  daily_withdraw_limit_fen: 500000  # 单日提现累计上限（5000 元）
  daily_withdraw_count: 3           # 单日提现受理次数
  dual_approval_fen: 50000          # 单笔达到 500 元需双人审批
  daily_release_limit: 3            # 单日退单次数上限（仅司机责任计入）
  accept_timeout_seconds: 15        # 邀请确认超时（秒），超时换下一候选
  listen_window_seconds: 60         # 听单通道窗口，结束后转抢单池
  dispatch_window_seconds: 120      # 总派单时限，超时平台责任取消
  heartbeat_timeout_seconds: 60     # 空闲连续无心跳自动收车
  hall_list_limit: 50               # 接单大厅单页上限
  dispatch_weights:                 # 派单评分权重，总和必须等于 10000
    distance: 4000
    rating: 2500
    online: 1500
    success: 2000

file_storage:
  # 本地联调临时值：原为 minio，需外部对象存储。改用一个免依赖的后端——
  # order-service 开启 ARRIVAL 时会初始化 private reader，要求能构造出存储后端。
  provider: local
  max_size_mb: 100
  object_prefix: uploads
  public_base_url: ""
  allowed_extensions:
    - .doc
    - .docx
    - .pdf
    - .jpg
    - .jpeg
    - .png
    - .gif
    - .webp
    - .bmp
    - .svg
    - .mp4
    - .mov
    - .avi
    - .mkv
    - .webm
    - .mp3
    - .wav
    - .ogg
    - .m4a
    - .flac
    - .aac
  allowed_content_types:
    - application/msword
    - application/vnd.openxmlformats-officedocument.wordprocessingml.document
    - application/pdf
    - image/jpeg
    - image/png
    - image/gif
    - image/webp
    - image/bmp
    - image/svg+xml
    - video/mp4
    - video/quicktime
    - video/x-msvideo
    - video/x-matroska
    - video/webm
    - audio/mpeg
    - audio/wav
    - audio/x-wav
    - audio/ogg
    - audio/mp4
    - audio/flac
    - audio/aac
  local:
    root_dir: data/files
  minio:
    endpoint: ""
    access_key_id: ""
    secret_access_key: ""
    bucket: ""
    region: ""
    use_ssl: false
  oss:
    endpoint: ""
    access_key_id: ""
    access_key_secret: ""
    bucket: ""
  qiniu:
    access_key: ""
    secret_key: ""
    bucket: ""
    region: ""
    use_https: true
    use_cdn_domains: false
  cos:
    secret_id: ""
    secret_key: ""
    bucket: ""
    region: ""
    bucket_url: ""

redis:
  # 6379 被本机另一个带密码的 redis-server 占用（127.0.0.1 特定绑定优先于
  # docker 0.0.0.0 绑定），本项目统一走专用无密码实例 huazhu-shared-redis:6380。
  addr: 127.0.0.1:6380
  username: ""
  password: ""
  db: 0
  pool_size: 10
  dial_timeout: 5s
  read_timeout: 3s
  write_timeout: 3s
  lock:
    key_prefix: xiaolanshu
    default_ttl: 30s

elasticsearch:
  addresses:
    - http://127.0.0.1:9200
  username: ""
  password: ""
  cloud_id: ""
  api_key: ""

kafka:
  brokers:
    - 127.0.0.1:9092
  topic: xiaolanshu-events
  group_id: xiaolanshu-consumer
  client_id: xiaolanshu
  required_acks: all
  dial_timeout: 5s
  producer:
    max_attempts: 10
    batch_size: 100
    batch_bytes: 1048576
    batch_timeout: 10ms
    read_timeout: 10s
    write_timeout: 10s
    async: false
    compression: none
    allow_auto_topic_creation: false
  consumer:
    queue_capacity: 100
    min_bytes: 1
    max_bytes: 10485760
    max_wait: 10s
    read_batch_timeout: 10s
    commit_interval: 0s
    heartbeat_interval: 3s
    session_timeout: 30s
    rebalance_timeout: 30s
    start_offset: first
    watch_partition_changes: true
    max_attempts: 3
  sasl:
    enable: false
    mechanism: plain
    username: ""
    password: ""
  tls:
    enable: false
    insecure_skip_verify: false
    server_name: ""

rocketmq:
  name_servers:
    - 127.0.0.1:9876
  group_name: xiaolanshu-producer
  consumer_group: xiaolanshu-consumer
  namespace: ""
  access_key: ""
  secret_key: ""
  retry_times: 2
  send_timeout: 3s
  consume_message_batch_max_size: 1

alipay:
  app_id: ""
  private_key: ""
  alipay_public_key: ""
  production: false
  notify_url: ""
  return_url: ""
  encrypt_key: ""
  app_cert_public_key_path: ""
  alipay_root_cert_path: ""
  alipay_cert_public_key_path: ""

middleware:
  cors:
    allow_origins:
      - "*"
    allow_methods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
      - OPTIONS
    allow_headers:
      - Origin
      - Content-Type
      - Authorization
      - X-Request-ID
      # 账号标识头。带自定义头的请求会触发 CORS 预检，
      # 预检允许头列表里缺它会让浏览器直接拒绝请求，前端表现为 Failed to fetch。
      - X-Account-Id
    allow_credentials: false
  jwt:
    secret: ""
    issuer: xiaolanshu
    expire_seconds: 7200

log:
  service: xiaolanshu
  environment: local
  level: info
  encoding: json
  file:
    enabled: true
    filename: logs/app.log
    max_size_mb: 128
    max_backups: 14
    max_age_days: 7
    compress: true
