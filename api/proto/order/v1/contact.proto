syntax = "proto3";
package order.v1;
option go_package = "github.com/BwCloudWeGo/bw-cli/api/gen/order/v1;orderv1";

// 乘客联系（D07）：遵从 P09 的时段、对象授权与通讯契约。
// 司机页只提供入口与状态展示；消息正文、虚拟号与可验证授权由通讯安全域维护。
// Identity is always obtained from a verified authorization metadata token.
service ContactService {
  rpc SendMessage(SendMessageRequest) returns (SendMessageResult);
  rpc ListMessages(ListMessagesRequest) returns (ListMessagesResult);
  rpc RequestVirtualCall(VirtualCallRequest) returns (VirtualCallResult);
}

message SendMessageRequest { string order_id=1; string text=2; string client_message_id=3; string idempotency_key=4; }
message SendMessageResult { string intent_id=1; int64 seq=2; string state=3; }

message ListMessagesRequest { string order_id=1; int64 cursor=2; }
message ChatMessage { int64 seq=1; string from=2; string text=3; int64 t=4; string state=5; string client_message_id=6; }
message ListMessagesResult { repeated ChatMessage messages=1; int64 next_cursor=2; }

message VirtualCallRequest { string order_id=1; string idempotency_key=2; }
// simulated 为 true 时必须展示 notice（课程模拟，未实际接通）。
message VirtualCallResult { string virtual_number=1; int64 expires_at=2; bool simulated=3; string notice=4; }
